# Builds dad-assistant/installer/dist/HelperSetup.exe (too big to e-mail or chat: ~43 MB) and publishes it
# as a GitHub Release asset, so there is a permanent download link.  Also runs the app's tests first.
#
# The same release carries update.json + helper-app.zip: every installed helper checks update.json when it
# starts and installs a newer build by itself.  So a push here reaches Dad's laptop the next time he opens
# the helper.  Only pushes to the branches below publish; other branches just build and test.
name: Build HelperSetup.exe

on:
  workflow_dispatch:
  push:
    paths:
      - "dad-assistant/**"
      - ".github/workflows/helper-installer.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        working-directory: dad-assistant
        run: python -m unittest discover -s tests

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build the installer
        run: sh dad-assistant/installer/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HelperSetup
          path: |
            dad-assistant/installer/dist/HelperSetup.exe
            dad-assistant/installer/dist/helper-app.zip
            dad-assistant/installer/dist/update.json

      - name: Publish as a release download (and as an automatic update)
        if: github.ref_name == 'ccr-2106592e-sihkos' || github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helper-installer-latest
          name: HelperSetup.exe (latest build)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            One-file Arabic installer for the dad-assistant helper (Windows 7 SP1 or newer).
            Built from ${{ github.sha }} on branch ${{ github.ref_name }}.
            Double-click HelperSetup.exe on the laptop; see dad-assistant/README.md.
          overwrite_files: true
          files: |
            dad-assistant/installer/dist/HelperSetup.exe
            dad-assistant/installer/dist/helper-app.zip
            dad-assistant/installer/dist/update.json
